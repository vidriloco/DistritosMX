{% comment %}
The trigger, shared by every page that offers one. Nothing runs on a schedule,
so this button is the only thing that fills the queue.
{% endcomment %}
<form method="post" class="dsh-row" style="align-items:flex-end">
    {% csrf_token %}
    <input type="hidden" name="action" value="run">
    <div class="dsh-field" style="flex:0 0 130px">
        <label for="run-days">Días hacia atrás</label>
        <input class="dsh-input" id="run-days" type="number" name="days" value="7" min="1" max="365">
    </div>
    <button type="submit" class="dsh-btn is-primary">Buscar notas ahora</button>
    <p class="dsh-small dsh-muted" style="margin:0 0 8px">
        Lee las fuentes activas y guarda lo que coincida como <em>por revisar</em>.
        Corre en segundo plano.
    </p>
</form>
