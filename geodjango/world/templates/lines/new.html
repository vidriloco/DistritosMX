{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <title>Wikiando: Nueva Ruta</title>

    <link rel="shortcut icon" href="{% static 'images/shortcut-logo.png' %}" type="image/x-icon" />

    <meta name="description" content="Mapa interactivo con las rutas de transporte público en la ciudad">
    <meta name="keywords" content="movilidad, transporte público, trenes, ciclovias, metros, tren ligero, transportes eléctricos, tren suburbano, cablebús, mexibús, metrobús, tren suburbano, tren interburbano, el insurgente">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Mapbox CSS/JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.7.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.7.0/mapbox-gl.css' rel='stylesheet' />

    <link rel="canonical" href="https://wikiando.mx/megalopolis" />

    <meta property="og:title" content="La red que tenemos - Wikiando: La movilidad de todos">
    <meta property="og:description" content="Mapa interactivo con las rutas de transporte público en la ciudad">
    <meta property="og:image" content="https://wikiando.mx/static/images/intro-social-media.jpg">
    <meta property="og:url" content="https://wikiando.mx/megalopolis">

    <meta name="twitter:title" content="La red que tenemos - Wikiando: La movilidad de todos">
    <meta name="twitter:description" content="Mapa interactivo con las rutas de transporte público en la ciudad">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://wikiando.mx/static/images/intro-social-media.jpg">

    {% include '_shared_css.html' %}
</head>
<body>
    {% include '_shared_navbar.html' %}
    <!-- Map container -->
    <div id='map' style='width: 100%; height: calc(100vh - 56px);'></div>
    
    <div class="d-flex justify-content-center align-items-center" style="position: absolute; top: 50%; left: 10px; right: 10px; transform: translate(0, -50%); overflow-y: auto; z-index: 9999 !important; height: calc(100vh - 100px);">
        <div id="general-info" class="card" style="width: 450px">
            <div class="container mb-3 mt-4">
                <h4>Nueva ruta</h4>
                <br/>
                <form id="line-form" method="post" enctype="multipart/form-data" action="{% url 'line_new_create' %}">
                    <div id="replaceable-form">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <div class="d-flex justify-content-end pb-3">
                        <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-light me-2">Atrás</a>
                        
                        <div id="creating-line-button" class="hidden">
                            <button class="btn btn-dark" type="button" disabled>
                                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                                <span role="status">Creando ruta...</span>
                            </button>
                        </div>
                        <button id="create-line-button" class="btn btn-dark">Crear</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        $('#line-form').on('submit', function() {
            $('#creating-line-button').removeClass('hidden');
            $('#create-line-button').addClass('hidden');
        });

        document.addEventListener('DOMContentLoaded', function() {
            var center = [-99.133209, 19.432608];
            var zoom = 15;
            var mapThemes = [
                'mapbox://styles/vidriloco/clx4dzh6902so01qphb9efd0f',
                'mapbox://styles/vidriloco/clx2vciu400c701qo520p9x8r',
                'mapbox://styles/vidriloco/clx4cxdtd02z701qm7shmbsf7',
                'mapbox://styles/vidriloco/clwy3ijjn010701qpax1s54hk',
                'mapbox://styles/vidriloco/clwzges1100kg01nm8hvw4lus',
                'mapbox://styles/vidriloco/clx4emew100rx01qoeebl5f8z',
                'mapbox://styles/vidriloco/clx4dzh6902so01qphb9efd0f'
            ];
        
            mapboxgl.accessToken = 'pk.eyJ1Ijoidmlkcmlsb2NvIiwiYSI6Ik1QRzIwZmcifQ.BzdjvFURAZ8uJ6kNovrrDA';

            var map = new mapboxgl.Map({
                container: 'map',
                style: mapThemes[Math.floor(Math.random() * mapThemes.length)],
                center: center,
                zoom: zoom,
            });

            function getRandomCoordinate() {
                var lat = center[1] + (Math.random() - 0.5) * 0.1;
                var lng = center[0] + (Math.random() - 0.5) * 0.1;
                return [lng, lat];
            }

            map.flyTo({
                center: getRandomCoordinate(),
                zoom: zoom
            });

        });
    </script>
</body>
</html>
