{% load static %}
<div class="modal fade" data-should-display="{{ line.published|yesno:'true,false' }}" id="edit-published-line-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5">Estás por editar una ruta publicada</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="small">Esta ruta está publicada actualmente. Considera que si haces cambios a la ruta los usuarios los verán reflejandos inmediatamente.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-light" onclick="doNotShowAgainEditPublishLineAlert()" data-bs-dismiss="modal">No volver a mostrar</button>
                <button class="btn btn-dark" data-bs-dismiss="modal">Aceptar</button>
            </div>
        </div>
    </div>
</div>
