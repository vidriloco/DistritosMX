{% load static %}
<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            ¡Felicidades!
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="issues-found text-center">
                <img src="{% static 'images/congratulations-icon.png' %}" alt="Celebration" style="width: 200px;">

                {% if line.published %}
                    <p>Tu ruta ha sido publicada con éxito</p>
                    <div style="display: flex; justify-content: center; gap: 10px;">
                        <a href="{% url 'line_details_slug_page' slug=line.slug %}" target="_blank" class="btn btn-light">Abrir</a>
                        <a id="copy-link" href="javascript:void(0);" class="btn btn-dark" onclick="copyToClipboard('{% url 'line_details_slug_page' slug=line.slug %}'); return false;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16">
                                <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/>
                                <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"/>
                              </svg>
                            Copiar Link</a>
                        <a id="copied-link" href="javascript:void(0);" class="btn btn-success hidden"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-check" viewBox="0 0 16 16">
                            <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z"/>
                          </svg> Copiado</a>
                    </div>
                {% else %}
                    <p>Has delistado tu ruta correctamente</p>
                {% endif %}
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-dark" data-bs-dismiss="modal">Cerrar</button>
        </div>
    </div>
</div>

<script>
    $('#line-change-publish-status').modal('show');
    {% if line.published %}
        $('.published-text-label').text('Delistar');
    {% else %}
        $('.published-text-label').text('Publicar');
    {% endif %}

    function copyToClipboard(url) {
        navigator.clipboard.writeText(window.location.origin + url);
        $('#copy-link').addClass('hidden');
        $('#copied-link').removeClass('hidden');
    }
</script>
