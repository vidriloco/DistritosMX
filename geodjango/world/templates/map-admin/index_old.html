<!DOCTYPE html>
<html>
<head>

    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="{% static 'css/map-admin.css' %}" rel="stylesheet" />
    <style>
        body {

            overflow: hidden;
        }
        #root {

<body>
    <div id="root"></div>

    <script type="text/babel">
        function LinesNavigator({ transportData, transportSystems, onClose, map, onLineSelect, setIsClosePanelVisible }) {
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedLine, setSelectedLine] = React.useState(null);

            // Sort function for systems and lines
            const sortTransportData = (data) => {
                // Sort systems alphabetically
                const sortedSystems = Object.keys(data).sort((a, b) => {
                    const nameA = (transportSystems[a] && transportSystems[a].name) || a;
                    const nameB = (transportSystems[b] && transportSystems[b].name) || b;
                    return nameA.localeCompare(nameB, 'es', { sensitivity: 'base' });
                });

                // Sort lines within each system
                const sortedData = {};
                sortedSystems.forEach(system => {
                    sortedData[system] = [...data[system]].sort((a, b) => {
                        // Get line numbers as strings
                        const lineNumA = String(a.line_number || '');
                        const lineNumB = String(b.line_number || '');
                        
                        // Check if both are numbers
                        const isNumA = !isNaN(parseInt(lineNumA));
                        const isNumB = !isNaN(parseInt(lineNumB));
                        
                        if (isNumA && isNumB) {
                            // Both are numbers, sort numerically
                            return parseInt(lineNumA) - parseInt(lineNumB);
                        } else if (isNumA) {
                            // A is number, B is letter - numbers come first
                            return -1;
                        } else if (isNumB) {
                            // A is letter, B is number - numbers come first
                            return 1;
                        } else {
                            // Both are letters, sort alphabetically
                            return lineNumA.localeCompare(lineNumB, 'es', { sensitivity: 'base' });
                        }
                    });
                });

                return sortedData;
            };

            // Sort initial data
            const sortedInitialData = React.useMemo(() => {
                return sortTransportData(transportData);
            }, [transportData, transportSystems]);

            const filteredData = React.useMemo(() => {
                if (!searchQuery) return sortedInitialData;

                const query = searchQuery.toLowerCase();
                const filtered = {};

                Object.entries(sortedInitialData).forEach(([system, lines]) => {
                    if (!lines || !Array.isArray(lines)) return;

                    const systemInfo = transportSystems[system];
                    const systemName = systemInfo ? systemInfo.name : system;
                    
                    if (systemName.toLowerCase().includes(query)) {
                        filtered[system] = lines;
                    } else {
                        const matchingLines = lines.filter(line => {
                            if (!line) return false;
                            const composed_name = line.name + ': ' + line.route;
                            return composed_name.toLowerCase().includes(query);
                        });
                        
                        if (matchingLines.length > 0) {
                            filtered[system] = matchingLines;
                        }
                    }
                });

                return sortTransportData(filtered);
            }, [sortedInitialData, transportSystems, searchQuery]);

            // Check if transportData is loaded
            if (!transportData || Object.keys(transportData).length === 0) {
                return (
                    <div className="overlay">
                        <div className="search-dialog">
                            <div className="search-dialog-header">
                                <h3 className="search-dialog-title">Buscar Líneas</h3>
                                <button className="close-button" onClick={onClose}>×</button>
                            </div>
                            <div className="search-dialog-content">
                                <div className="loading-message">Cargando datos de transporte...</div>
                            </div>
                        </div>
                    </div>
                );
            }

            const handleLineClick = (system, line) => {
                setSelectedLine({ system, line });
                
                // Calculate bounds of the line
                const bounds = new mapboxgl.LngLatBounds();
                line.paths.forEach(path => {
                    path.coordinates.forEach(coord => {
                        bounds.extend(coord);
                    });
                });

                // Add some padding around the bounds
                const padding = {
                    top: 50,
                    bottom: 50,
                    left: 50,
                    right: 50
                };

                // Center map on the line
                map.current.fitBounds(bounds, {
                    padding: padding,
                    duration: 1000
                });
                
                // Hide all lines except the selected one
                Object.entries(transportData).forEach(([currentSystem, currentLines]) => {
                    currentLines.forEach(currentLine => {
                        const lineId = `${currentSystem}-line-${currentLine.id}`;
                        const stationsId = `${currentSystem}-stations-${currentLine.id}`;
                        
                        if (map.current.getLayer(lineId)) {
                            if (currentSystem === system && currentLine.id === line.id) {
                                // Show selected line
                                map.current.setLayoutProperty(lineId, 'visibility', 'visible');
                                map.current.setLayoutProperty(stationsId, 'visibility', 'visible');
                            } else {
                                // Hide other lines
                                map.current.setLayoutProperty(lineId, 'visibility', 'none');
                                map.current.setLayoutProperty(stationsId, 'visibility', 'none');
                            }
                        }
                    });
                });

                // Notify parent component about line selection
                if (onLineSelect) {
                    onLineSelect({ system, line });
                }
                
                // Collapse the transport systems menu
                if (setIsClosePanelVisible) {
                    setIsClosePanelVisible(false);
                }
                
                // Minimize the search dialog
                onClose();
            };

            const handleClose = () => {
                // Reset all line opacities when closing
                Object.entries(transportData).forEach(([system, lines]) => {
                    lines.forEach(line => {
                        const lineId = `${system}-line-${line.id}`;
                        const stationsId = `${system}-stations-${line.id}`;
                        
                        if (map.current.getLayer(lineId)) {
                            map.current.setLayoutProperty(lineId, 'visibility', 'visible');
                            map.current.setLayoutProperty(stationsId, 'visibility', 'visible');
                        }
                    });
                });
                setSelectedLine(null);
                onClose();
            };

            return (
                <div className="overlay">
                    <div className="search-dialog">
                        <div className="search-dialog-header">
                            <h3 className="search-dialog-title">Buscar</h3>
                            <button className="close-button" onClick={handleClose}>×</button>
                        </div>
                        <div className="search-input-container">
                            <svg 
                                className="search-icon-input"
                                xmlns="http://www.w3.org/2000/svg" 
                                width="16" 
                                height="16" 
                                viewBox="0 0 24 24" 
                                fill="none" 
                                stroke="currentColor" 
                                stroke-width="2" 
                                stroke-linecap="round" 
                                stroke-linejoin="round"
                            >
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input
                                type="text"
                                className="search-input"
                                placeholder="Buscar líneas y sistemas..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                autoFocus
                            />
                        </div>
                        <div className="search-dialog-content">
                            {Object.entries(filteredData).length === 0 ? (
                                <div className="no-results">No se encontraron resultados</div>
                            ) : (
                                Object.entries(filteredData).map(([system, lines]) => {
                                    const systemInfo = transportSystems[system];
                                    const systemName = systemInfo ? systemInfo.name : system;
                                    
                                    return (
                                        <div key={system} className="transport-section">
                                            <div className="transport-section-title">
                                                {systemName}
                                            </div>
                                            {lines.map(line => {
                                                const lineNumber = parseInt(line.line_number);
                                                const displayNumber = lineNumber && lineNumber !== 0 ? lineNumber : line.line_number;
                                                const isSelected = selectedLine && 
                                                    selectedLine.system === system && 
                                                    selectedLine.line.id === line.id;
                                                
                                                return (
                                                    <div 
                                                        key={line.id} 
                                                        className={`line-item ${isSelected ? 'selected' : ''}`}
                                                        onClick={() => handleLineClick(system, line)}
                                                    >
                                                        <span className="line-name">
                                                            <span className="line-number">Línea {displayNumber}: {line.route}</span>
                                                            {line.name}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function LineInfoPanel({ selectedLine, transportSystems, onClose }) {
            if (!selectedLine) return null;

            const { system, line } = selectedLine;
            const systemInfo = transportSystems[system];
            const systemName = systemInfo ? systemInfo.name : system;
            const systemIcon = systemInfo ? systemInfo.icon : 'no-transports.png';
            const lineNumber = parseInt(line.line_number);
            const displayNumber = lineNumber && lineNumber !== 0 ? lineNumber : line.line_number;

            return (
                <div className="floating-info-panel">
                    <div className="info-panel-header">
                        <div className="info-panel-header-content">
                            <img src={systemIcon} alt={system} className="info-panel-icon" />
                            <h3 className="info-panel-title">{systemName}</h3>
                        </div>
                        <button className="close-info-button" onClick={onClose}>×</button>
                    </div>
                    <div className="info-panel-content">
                        <div className="info-line">
                            <div className="info-number">Línea {displayNumber}</div>
                            <div className="info-route">{line.route}</div>
                        </div>
                        <div className="info-line">
                            {line.stations && line.stations.length > 0 ? (
                                <div className="station-list">
                                    {line.stations.map((station, index) => (
                                        <div key={station.id || index} className="station-item">
                                            <div className={`station-marker ${system}`} />
                                            <span className="station-name">{station.name}</span>
                                            {station.identifier && (
                                                <span className="station-identifier">({station.identifier})</span>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="no-stations">No hay estaciones disponibles para esta línea</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function LayerInfoPanel({ transportData, visibleSystems, toggleSystemVisibility, transportSystems, map, showSearchDialog, setShowSearchDialog, onLineSelect }) {
            const [isMenuOpen, setIsMenuOpen] = React.useState(false);
            const [isClosePanelVisible, setIsClosePanelVisible] = React.useState(false);
            
            const handleSystemClick = (system) => {
                toggleSystemVisibility(system);
            };

            const handleSearchClick = () => {
                if (!transportData || Object.keys(transportData).length === 0) {
                    alert('Los datos de transporte aún se están cargando. Por favor espere un momento.');
                    return;
                }
                setShowSearchDialog(true);
            };

            const handleCloseSearch = () => {
                setShowSearchDialog(false);
            };

            const getSystemDisplayName = (system) => {
                const systemInfo = transportSystems[system];
                return systemInfo ? systemInfo.name : system;
            };

            const getSystemIcon = (system) => {
                const systemInfo = transportSystems[system];
                return systemInfo ? systemInfo.icon : 'no-transports.png';
            };

            const toggleMenu = () => {
                setIsMenuOpen(!isMenuOpen);
                setIsClosePanelVisible(!isClosePanelVisible);
            };

            return (
                <div id="should-display-menu" className="card">
                    {!isClosePanelVisible ? (
                        <div id="map-layer-button" className="menu" onClick={toggleMenu}>
                            <img src="{% static 'images/layer-menu-icon.png' %}" alt="Movilidad" className="icon" />

                        </div>
                    ) : (

                                    className="search-icon"

                                    viewBox="0 0 24 24" 
                                    fill="none" 
                                    stroke="currentColor" 
                                    stroke-width="2"

                                >

                                </svg>
                            </div>
                            <div className="system-list">

                                    <div 
                                        key={system} 
                                        className={`system-item ${visibleSystems[system] ? 'selected' : ''}`}
                                        onClick={() => handleSystemClick(system)}
                                    >
                                        <div className="system-info">

                            </div>

                            map={map}
                            onLineSelect={onLineSelect}

            const processTransportData = (data) => {
                if (!map.current) return;

                // Process each system's data
                Object.entries(data).forEach(([system, geojson]) => {
                    if (!geojson || !geojson.features) return;

                    // Separate features by type
                    const lines = geojson.features.filter(f => f.properties.type === 'line');
                    const stations = geojson.features.filter(f => f.properties.type === 'station');

                    // Debug: Log first station to see its properties
                    if (stations.length > 0) {
                        console.log('First station properties:', stations[0].properties);
                    }

                    // Create a map of line numbers to line colors for this system
                    const lineColorMap = {};
                    lines.forEach(line => {
                        lineColorMap[line.properties.line_number] = line.properties.color;
                    });

                    console.log('Line color map:', lineColorMap);

                    // Add line color to station properties
                    stations.forEach(station => {
                        // Try multiple approaches to get the line color
                        let lineColor = null;
                        
                        // Approach 1: Check lines_serving array
                        if (station.properties.lines_serving && station.properties.lines_serving.length > 0) {
                            const firstLineNumber = station.properties.lines_serving[0];
                            lineColor = lineColorMap[firstLineNumber];
                        }
                        // Approach 2: Check line_number
                        else if (station.properties.line_number) {
                            lineColor = lineColorMap[station.properties.line_number];
                        }
                        // Approach 3: Check if station has its own color that matches a line color
                        else if (station.properties.color && lineColorMap[station.properties.color]) {
                            lineColor = station.properties.color;
                        }
                        
                        // Set the line color, fallback to station color
                        station.properties.line_color = lineColor || station.properties.color;
                        
                        console.log(`Station ${station.properties.name}: line_color = ${station.properties.line_color}`);
                    });

                    // Create or update sources
                    if (!map.current.getSource('all-lines')) {
                        map.current.addSource('all-lines', {
                            type: 'geojson',
                            data: {
                                type: 'FeatureCollection',
                                features: []
                            }
                        });
                    }

                    if (!map.current.getSource('all-stations')) {
                        map.current.addSource('all-stations', {
                            type: 'geojson',
                            data: {
                                type: 'FeatureCollection',
                                features: []
                            }
                        });
                    }

                    // Update sources with new data
                    const currentLines = map.current.getSource('all-lines')._data.features;
                    const currentStations = map.current.getSource('all-stations')._data.features;

                    // Add system property to features
                    lines.forEach(line => {
                        line.properties.system = system;
                        if (!currentLines.some(l => l.properties.id === line.properties.id)) {
                            currentLines.push(line);
                        }
                    });

                    stations.forEach(station => {
                        station.properties.system = system;
                        if (!currentStations.some(s => s.properties.id === station.properties.id)) {
                            currentStations.push(station);
                        }
                    });

                    // Update sources
                    map.current.getSource('all-lines').setData({
                        type: 'FeatureCollection',
                        features: currentLines
                    });

                    map.current.getSource('all-stations').setData({
                        type: 'FeatureCollection',
                        features: currentStations
                    });

                    // Add layers if they don't exist
                    if (!map.current.getLayer('all-lines')) {
                        // Active lines layer
                        map.current.addLayer({
                            id: 'all-lines',
                            type: 'line',
                            source: 'all-lines',
                            filter: ['all', ['==', 'type', 'line'], ['==', 'status', 'active']],
                            paint: {
                                'line-color': ['get', 'color'],
                                'line-width': ['get', 'stroke']
                            }

                            type: 'line',
                            source: 'all-lines',
                            filter: ['all', ['==', 'type', 'line'], ['==', 'status', 'under-construction']],
                            paint: {
                                'line-color': ['get', 'color'],
                                'line-width': ['get', 'stroke'],
                                'line-dasharray': [2, 1.5]
                            }
                        });

            // Function to update layer visibility based on visibleSystems state
            const updateLayerVisibility = () => {
                if (!map.current) return;

                try {
                    // Create a filter that includes all visible systems
                    const lineFilter = ['any'];
                    Object.entries(visibleSystems).forEach(([system, isVisible]) => {
                        if (isVisible) {
                            lineFilter.push(['==', ['get', 'system'], system]);
                        }
                    });

                    // If no systems are visible, hide everything
                    if (lineFilter.length === 1) {
                        lineFilter.push(['==', ['get', 'system'], 'none']);
                    }

                    console.log('Applying filter to layers:', lineFilter);

                    // Apply the filter to all relevant layers
                    const layers = [
                        'all-lines',
                        'all-lines-under-construction',
                        'all-lines-names',
                        'all-stations',
                        'all-stations-names',
                        'all-stations-ecobici',
                        'all-stations-ecobici-names'
                    ];

                    layers.forEach(layerId => {
                        if (map.current.getLayer(layerId)) {
                            map.current.setLayoutProperty(layerId, 'visibility', 'visible');

                            console.log(`Layer ${layerId} is visible and filtered`);

                        }

                    console.error('Error updating layer visibility:', error);

                    transportSystems[system].selected = newState[system];

            const fetchTransportLines = async (system) => {
                const url = UrlUtils.getTransportUrl(system);
                
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    
                    // Update transport data state
                    setTransportData(prev => ({
                        ...prev,
                        [system]: data
                    }));

                    // Process the data to update the map
                    processTransportData({ [system]: data });
                } catch (err) {
                    console.error('Error fetching transport lines:', err);
                }

            const fetchTransportData = async () => {
                ['rtp', 'metro', 'metrobus', 'trolebus', 'cablebus', 'ecobici', 'concesionados', 'tren-interurbano', 'tren-suburbano', 'mexibus', 'mexicable', 'tren-ligero'].forEach(async (system) => {

            const handleCloseLineInfo = () => {
                setSelectedLine(null);

                updateLayerVisibility();
            };

            const showStationDetails = (stationProperties) => {
                // Hide line details if they're showing
                setSelectedLine(null);
                
                // Hide the layer panel
                setIsLayerPanelCollapsed(true);
                
                const systemInfo = transportSystems[stationProperties.system];
                setSelectedStation({
                    name: stationProperties.name,
                    system: stationProperties.system,
                    icon: systemInfo && systemInfo.icon ? systemInfo.icon : 'no-transports.png'
                });
            };

            const handleCloseStationDetails = () => {
                setSelectedStation(null);
                // Restore layer panel visibility
                setIsLayerPanelCollapsed(false);
            };

            // Add click handlers for lines and stations
            const addMapEventHandlers = () => {
                if (!map.current) return;

                // Remove existing handlers to avoid duplicates
                map.current.off('click', 'all-lines');
                map.current.off('click', 'all-stations');
                map.current.off('mouseenter', 'all-lines');
                map.current.off('mouseleave', 'all-lines');
                map.current.off('mouseenter', 'all-stations');
                map.current.off('mouseleave', 'all-stations');

                map.current.on('click', 'all-lines', (e) => {
                    if (!e.features || e.features.length === 0) return;
                    const feature = e.features[0];
                    if (feature.properties) {
                        console.log(feature.properties.line_number);
                        // Find all stations for this line
                        const lineStations = Object.values(transportData)
                            .flatMap(geojson => geojson.features || [])
                            .filter(f => f.properties.type === 'station')
                            .filter(s => 
                                s.properties.lines_serving && 
                                s.properties.lines_serving.includes(feature.properties.line_number) &&
                                s.properties.system === feature.properties.system
                            );

                        // Set the selected line in state
                        setSelectedLine({
                            system: feature.properties.system,
                            line: {
                                id: feature.properties.id,
                                line_number: feature.properties.line_number,
                                route: feature.properties.route,
                                name: feature.properties.name,
                                stations: lineStations.map(s => ({
                                    id: s.properties.id,
                                    name: s.properties.name,
                                    identifier: s.properties.identifier
                                }))
                            }
                        });

                        // Create a filter to show only the selected line and its stations
                        const lineFilter = [
                            'any',
                            ['all',
                                ['==', ['get', 'type'], 'line'],
                                ['==', ['get', 'line_number'], feature.properties.line_number],
                                ['==', ['get', 'system'], feature.properties.system]
                            ],
                            ['all',
                                ['==', ['get', 'type'], 'station'],
                                ['==', ['get', 'line_number'], feature.properties.line_number],
                                ['==', ['get', 'system'], feature.properties.system]
                            ]
                        ];

                        // Apply the filter to all relevant layers
                        const layers = [
                            'all-lines',
                            'all-lines-under-construction',
                            'all-lines-names',
                            'all-stations',
                            'all-stations-names',
                            'all-stations-ecobici',
                            'all-stations-ecobici-names'
                        ];

                        layers.forEach(layerId => {
                            if (map.current.getLayer(layerId)) {
                                map.current.setFilter(layerId, lineFilter);
                            }
                        });

                        // Center the map on the selected line
                        const bounds = new mapboxgl.LngLatBounds();
                        feature.geometry.coordinates.forEach(coord => {
                            bounds.extend(coord);
                        });

                        // Add padding for better view
                        const padding = {
                            top: 50,
                            bottom: 50,
                            left: 50,
                            right: 50
                        };

                        map.current.fitBounds(bounds, {
                            padding: padding,
                            duration: 1000
                        });
                    }
                });

                map.current.on('click', 'all-stations', (e) => {
                    if (!e.features || e.features.length === 0) return;
                    const feature = e.features[0];
                    if (feature.properties) {
                        // Display station details
                        showStationDetails(feature.properties);
                    }
                });

                // Add hover effects
                map.current.on('mouseenter', 'all-lines', () => {
                    map.current.getCanvas().style.cursor = 'pointer';
                });

                map.current.on('mouseleave', 'all-lines', () => {
                    map.current.getCanvas().style.cursor = '';
                });

                map.current.on('mouseenter', 'all-stations', () => {
                    map.current.getCanvas().style.cursor = 'pointer';
                });

                map.current.on('mouseleave', 'all-stations', () => {
                    map.current.getCanvas().style.cursor = '';
                });
            };

            // Update layer visibility when visibleSystems changes
            React.useEffect(() => {
                updateLayerVisibility();
            }, [visibleSystems]);

            // Add event handlers when transport data is loaded
            React.useEffect(() => {
                if (Object.keys(transportData).length > 0) {
                    addMapEventHandlers();
                }
            }, [transportData]);

            return (
                <div className="map-admin-container">
                    <div ref={mapContainer} className="map-container" />
                    <LayersListPanel 
                        transportData={transportData}
                        visibleSystems={visibleSystems}
                        toggleSystemVisibility={toggleSystemVisibility}
                        transportSystems={transportSystems}
                        map={map}
                        showSearchDialog={showSearchDialog}
                        setShowSearchDialog={setShowSearchDialog}
                        onLineSelect={handleLineSelect}
                    />
                    {selectedLine && (
                        <LayersListPanel 
                            selectedLine={selectedLine}
                            transportSystems={transportSystems}
                            onClose={handleCloseLineInfo}
                        />
                    )}
                    {selectedStation && (
                        <div className="station-details-container">
                            <div className="station-details-header">
                                <h3 className="station-details-title">Detalles de la Estación</h3>
                                <button className="close-station-button" onClick={handleCloseStationDetails}>×</button>
                            </div>
                            <div className="station-details-content">
                                <img src={selectedStation.icon} alt={selectedStation.system} className="station-icon" />
                                <h4 className="station-name">{selectedStation.name}</h4>
                                <p className="station-system">Sistema: {selectedStation.system}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
