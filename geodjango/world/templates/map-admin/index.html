    <!-- Analytics Service -->
    <script type="text/babel">
        // Analytics Constants (for backward compatibility)
        window.ANALYTICS_EVENTS = {
            VISIT_STARTED: 'visit-started',
            TO_USE_CASES: 'to-use-cases',
            INTEREST_HOUSING: 'interest-housing',
            TO_BUSINESS: 'to-business',
            INTEREST_TRANSPORT: 'interest-transport',
            USER_CONVERTED: 'user-converted',
            EXPLORE_VISITED: 'explore-visited',
            BUSINESS_VISITED: 'business',
            USER_SELECTED_LOCATION: 'user-selected-location',
            USER_SELECTED_CATEGORIES: 'user-selected-categories',
            USER_SELECTED_RADIUS: 'user-selected-radius',
            USER_CONFIRMED_SELECTION: 'user-confirmed-selection',
            USER_REVIEWING_SELECTION: 'user-reviewing-selection',
            USER_SEEING_STATS: 'user-seeing-stats',
            USER_REFINE_SELECTION: 'user-refine-selection',
            USER_SEEING_MORE_STATS: 'user-seeing-more-stats',
            USER_CLICK_PDF_GENERATION: 'user-click-pdf-generation',
            PAGE_VIEW: 'page-view',
            BUTTON_CLICK: 'button-click',
            FORM_SUBMIT: 'form-submit',
            ERROR_OCCURRED: 'error-occurred',
            FEATURE_USED: 'feature-used'
        };

        window.ANALYTICS_PROPERTIES = {
            PAGE_URL: 'page_url',
            PAGE_TITLE: 'page_title',
            REFERRER: 'referrer',
            USER_ID: 'user_id',
            USER_TYPE: 'user_type',
            SESSION_ID: 'session_id',
            TIMESTAMP: 'timestamp',
            BUTTON_TEXT: 'button_text',
            BUTTON_LOCATION: 'button_location',
            FEATURE_NAME: 'feature_name',
            ERROR_MESSAGE: 'error_message'
        };

        // Functional Analytics Service (Babel-compatible)
        (function() {
            // Global state for analytics
            let mixpanelInstance = null;
            let isInitialized = false;
            let projectToken = null;
            let sessionId = null;

            // Helper functions
            function getEventName(eventKey) {
                return window.ANALYTICS_EVENTS[eventKey] || eventKey;
            }

            function validateEventProperties(properties = {}) {
                const validated = {};
                
                if (!properties[window.ANALYTICS_PROPERTIES.TIMESTAMP]) {
                    validated[window.ANALYTICS_PROPERTIES.TIMESTAMP] = new Date().toISOString();
                }
                
                if (!properties[window.ANALYTICS_PROPERTIES.PAGE_URL]) {
                    validated[window.ANALYTICS_PROPERTIES.PAGE_URL] = window.location.href;
                }
                
                if (!properties[window.ANALYTICS_PROPERTIES.PAGE_TITLE]) {
                    validated[window.ANALYTICS_PROPERTIES.PAGE_TITLE] = document.title;
                }
                
                return { ...validated, ...properties };
            }

            function generateSessionId() {
                return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            function setDefaultProperties() {
                if (!isInitialized) return;

                const defaultProps = {
                    [window.ANALYTICS_PROPERTIES.PAGE_URL]: window.location.href,
                    [window.ANALYTICS_PROPERTIES.PAGE_TITLE]: document.title,
                    [window.ANALYTICS_PROPERTIES.REFERRER]: document.referrer,
                    [window.ANALYTICS_PROPERTIES.SESSION_ID]: sessionId,
                    [window.ANALYTICS_PROPERTIES.TIMESTAMP]: new Date().toISOString()
                };

                mixpanelInstance.register(defaultProps);
            }

            // Main analytics functions
            window.initAnalytics = function(token, options = {}) {
                if (isInitialized) {
                    console.warn('Analytics already initialized');
                    return;
                }

                projectToken = token;
                
                if (typeof mixpanel === 'undefined') {
                    console.error('Mixpanel is not loaded. Make sure to include the Mixpanel script.');
                    return;
                }

                try {
                    mixpanel.init(token, {
                        debug: options.debug || false,
                        track_pageview: options.track_pageview || false,
                        persistence: options.persistence || 'localStorage',
                        ...options
                    });

                    mixpanelInstance = mixpanel;
                    isInitialized = true;
                    sessionId = generateSessionId();

                    setDefaultProperties();
                    console.log('Analytics initialized successfully');
                } catch (error) {
                    console.error('Failed to initialize analytics:', error);
                }
            };

            window.trackEvent = function(eventKey, properties = {}) {
                if (!isInitialized) {
                    console.warn('Analytics not initialized. Event not tracked:', eventKey);
                    return;
                }

                const eventName = getEventName(eventKey);
                const validatedProperties = validateEventProperties(properties);

                try {
                    mixpanelInstance.track(eventName, validatedProperties);
                    console.log('Event tracked:', eventName, validatedProperties);
                } catch (error) {
                    console.error('Failed to track event:', eventName, error);
                }
            };

            window.trackPageView = function(pageName, properties = {}) {
                window.trackEvent('PAGE_VIEW', {
                    [window.ANALYTICS_PROPERTIES.FEATURE_NAME]: pageName,
                    ...properties
                });
            };

            window.trackButtonClick = function(buttonText, buttonLocation, properties = {}) {
                window.trackEvent('BUTTON_CLICK', {
                    [window.ANALYTICS_PROPERTIES.BUTTON_TEXT]: buttonText,
                    [window.ANALYTICS_PROPERTIES.BUTTON_LOCATION]: buttonLocation,
                    ...properties
                });
            };

            window.trackError = function(errorMessage, errorType = 'general', properties = {}) {
                window.trackEvent('ERROR_OCCURRED', {
                    [window.ANALYTICS_PROPERTIES.ERROR_MESSAGE]: errorMessage,
                    error_type: errorType,
                    ...properties
                });
            };

            // Convenience functions for common events
            window.trackVisitStarted = (properties = {}) => window.trackEvent('VISIT_STARTED', properties);
            window.trackToUseCases = (properties = {}) => window.trackEvent('TO_USE_CASES', properties);
            window.trackInterestHousing = (properties = {}) => window.trackEvent('INTEREST_HOUSING', properties);
            window.trackToBusiness = (properties = {}) => window.trackEvent('TO_BUSINESS', properties);
            window.trackInterestTransport = (properties = {}) => window.trackEvent('INTEREST_TRANSPORT', properties);
            window.trackUserConverted = (properties = {}) => window.trackEvent('USER_CONVERTED', properties);
            window.trackExploreVisited = (properties = {}) => window.trackEvent('EXPLORE_VISITED', properties);
            window.trackBusinessVisited = (properties = {}) => window.trackEvent('BUSINESS_VISITED', properties);
            window.trackUserSelectedLocation = (properties = {}) => window.trackEvent('USER_SELECTED_LOCATION', properties);
            window.trackUserSelectedCategories = (properties = {}) => window.trackEvent('USER_SELECTED_CATEGORIES', properties);
            window.trackUserSelectedRadius = (properties = {}) => window.trackEvent('USER_SELECTED_RADIUS', properties);
            window.trackUserConfirmedSelection = (properties = {}) => window.trackEvent('USER_CONFIRMED_SELECTION', properties);
            window.trackUserReviewingSelection = (properties = {}) => window.trackEvent('USER_REVIEWING_SELECTION', properties);
            window.trackUserSeeingStats = (properties = {}) => window.trackEvent('USER_SEEING_STATS', properties);
            window.trackUserRefineSelection = (properties = {}) => window.trackEvent('USER_REFINE_SELECTION', properties);
            window.trackUserSeeingMoreStats = (properties = {}) => window.trackEvent('USER_SEEING_MORE_STATS', properties);
            window.trackUserClickPdfGeneration = (properties = {}) => window.trackEvent('USER_CLICK_PDF_GENERATION', properties);

            // Utility functions
            window.isAnalyticsInitialized = function() {
                return isInitialized;
            };

            window.getSessionId = function() {
                return sessionId;
            };

            window.resetAnalytics = function() {
                if (!isInitialized) return;

                try {
                    mixpanelInstance.reset();
                } catch (error) {
                    console.error('Failed to reset analytics:', error);
                }
            };
        })();

        // Create a compatibility wrapper for the old analyticsService interface
        window.analyticsService = {
            init: (token, options = {}) => {
                if (window.initAnalytics) {
                    window.initAnalytics(token, options);
                }
            },
            track: (eventKey, properties = {}) => {
                if (window.trackEvent) {
                    window.trackEvent(eventKey, properties);
                }
            },
            trackButtonClick: (buttonText, buttonLocation, properties = {}) => {
                if (window.trackButtonClick) {
                    window.trackButtonClick(buttonText, buttonLocation, properties);
                }
            }
        };

        // Initialize analytics immediately if config is available
        if (window.ANALYTICS_CONFIG && window.isAnalyticsEnabled && window.isAnalyticsEnabled()) {
            const config = window.getAnalyticsConfig('MIXPANEL');
            
            if (window.initAnalytics) {
                window.initAnalytics(config.PROJECT_TOKEN, {
                    debug: config.DEBUG || false,
                    track_pageview: config.TRACK_PAGEVIEW || false,
                    persistence: config.PERSISTENCE || 'localStorage',
                    ...config.OPTIONS
                });
                
                console.log('Analytics initialized immediately');
            }
        }
    </script>

    <!-- SEO and Analytics page view tracking -->
    <script type="text/babel">
        // SEO Configuration for different routes
        const seoConfig = {
            '/': {
                title: 'Distritos MX - Análisis Territorial Inteligente',
                description: 'Plataforma de análisis territorial y visualización de datos geoespaciales para México. Explora indicadores demográficos, económicos y de movilidad urbana.',

                ogTitle: 'Distritos MX - Análisis Territorial Inteligente',
                ogDescription: 'Plataforma de análisis territorial y visualización de datos geoespaciales para México. Explora indicadores demográficos, económicos y de movilidad urbana.',
                canonical: 'https://distritos.mx/'
            },
            '/explorar': {
                title: 'Explorar Territorio - Distritos MX',
                description: 'Explora el territorio mexicano con mapas interactivos y análisis geoespacial. Visualiza datos demográficos, económicos y de infraestructura urbana.',
                keywords: 'explorar territorio, mapas interactivos, análisis geoespacial, datos demográficos, infraestructura urbana, México',
                ogTitle: 'Explorar Territorio - Distritos MX',
                ogDescription: 'Explora el territorio mexicano con mapas interactivos y análisis geoespacial. Visualiza datos demográficos, económicos y de infraestructura urbana.',
                canonical: 'https://distritos.mx/explorar'
            },
            '/negocios': {
                title: 'Análisis de Negocios - Distritos MX',
                description: 'Herramientas de análisis de mercado y ubicación para negocios en México. Encuentra la mejor ubicación para tu empresa con datos geoespaciales.',
                keywords: 'análisis de negocios, ubicación de negocios, análisis de mercado, datos geoespaciales, México, emprendimiento',
                ogTitle: 'Análisis de Negocios - Distritos MX',
                ogDescription: 'Herramientas de análisis de mercado y ubicación para negocios en México. Encuentra la mejor ubicación para tu empresa con datos geoespaciales.',
                canonical: 'https://distritos.mx/negocios'
            },
            '/transporte': {
                title: 'Sistemas de Transporte - Distritos MX',
                description: 'Explora la red completa de transporte público de la Ciudad de México y área metropolitana. Visualiza rutas, estaciones y conectividad de todos los sistemas de transporte.',
                keywords: 'transporte público, metro, metrobús, cablebús, ecobici, rutas de transporte, estaciones, Ciudad de México, movilidad urbana',
                ogTitle: 'Sistemas de Transporte - Distritos MX',
                ogDescription: 'Explora la red completa de transporte público de la Ciudad de México y área metropolitana. Visualiza rutas, estaciones y conectividad de todos los sistemas de transporte.',
                canonical: 'https://distritos.mx/transporte'
            },
            '/proyectos/mundial-2025': {
                title: 'Recorridos y Rutas - Distritos MX',
                description: 'Planifica tus recorridos por la Ciudad de México con mapas interactivos y análisis de rutas. Encuentra la mejor forma de llegar a tu destino usando transporte público.',
                keywords: 'recorridos, rutas, planificación de viajes, transporte público, Ciudad de México, mapas interactivos, navegación urbana',
                ogTitle: 'Recorridos y Rutas - Distritos MX',
                ogDescription: 'Planifica tus recorridos por la Ciudad de México con mapas interactivos y análisis de rutas. Encuentra la mejor forma de llegar a tu destino usando transporte público.',
                canonical: 'https://distritos.mx/proyectos/mundial-2025'
            },
            '/trip-faker': {
                title: 'Trip Faker - Distritos MX',
                description: 'Prueba y visualiza recorridos con un mapa de Mapbox y un visor JSON.',
                keywords: 'trip faker, JSON, mapa, mapbox, recorridos, pruebas',
                ogTitle: 'Trip Faker - Distritos MX',
                ogDescription: 'Pantalla dividida con mapa y visor JSON para experimentar con recorridos.',
                canonical: 'https://distritos.mx/trip-faker'
            }
        };

        // Function to update SEO tags
        function updateSEOTags(path) {
            const config = seoConfig[path] || seoConfig['/'];
            
            // Update title
            document.title = config.title;
            
            // Update meta description
            let metaDescription = document.querySelector('meta[name="description"]');
            if (metaDescription) {
                metaDescription.setAttribute('content', config.description);
            }
            
            // Update meta keywords
            let metaKeywords = document.querySelector('meta[name="keywords"]');
            if (metaKeywords) {
                metaKeywords.setAttribute('content', config.keywords);
            }
            
            // Update Open Graph tags
            let ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) {
                ogTitle.setAttribute('content', config.ogTitle);
            }
            
            let ogDescription = document.querySelector('meta[property="og:description"]');
            if (ogDescription) {
                ogDescription.setAttribute('content', config.ogDescription);
            }
            
            let ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
                ogUrl.setAttribute('content', config.canonical);
            }
            
            // Update Twitter tags
            let twitterTitle = document.querySelector('meta[property="twitter:title"]');
            if (twitterTitle) {
                twitterTitle.setAttribute('content', config.ogTitle);
            }
            
            let twitterDescription = document.querySelector('meta[property="twitter:description"]');
            if (twitterDescription) {
                twitterDescription.setAttribute('content', config.ogDescription);
            }
            
            let twitterUrl = document.querySelector('meta[property="twitter:url"]');
            if (twitterUrl) {
                twitterUrl.setAttribute('content', config.canonical);
            }
            
            // Update canonical URL
            let canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) {
                canonical.setAttribute('href', config.canonical);
            }
            
            // Update structured data
            let structuredData = document.querySelector('script[type="application/ld+json"]');
            if (structuredData) {
                try {
                    const data = JSON.parse(structuredData.textContent);
                    data.name = config.title;
                    data.description = config.description;
                    data.url = config.canonical;
                    structuredData.textContent = JSON.stringify(data, null, 2);
                } catch (e) {
                    console.warn('Could not update structured data:', e);
                }
            }
        }

        // Function to handle route changes
        function handleRouteChange() {
            const currentPath = window.location.pathname;
            updateSEOTags(currentPath);
            
            // Track page view based on current path
            let pageType = 'unknown';
            
            if (currentPath === '/explorar' || currentPath === '/explorar/') {
                pageType = 'explore';
                // Track explore-visited event
                if (window.trackExploreVisited) {
                    window.trackExploreVisited({
                        page_path: currentPath,
                        user_agent: navigator.userAgent
                    });
                }
            } else if (currentPath.startsWith('/negocios')) {
                pageType = 'business';
                // Track business event
                if (window.trackBusinessVisited) {
                    window.trackBusinessVisited({
                        page_path: currentPath,
                        user_agent: navigator.userAgent
                    });
                }
            } else if (currentPath === '/transporte') {
                pageType = 'transport';
                // Track transport event
                if (window.trackTransportVisited) {
                    window.trackTransportVisited({
                        page_path: currentPath,
                        user_agent: navigator.userAgent
                    });
                }
            } else if (currentPath === '/proyectos/mundial-2025') {
                pageType = 'recorridos';
                // Track recorridos event
                if (window.trackRecorridosVisited) {
                    window.trackRecorridosVisited({
                        page_path: currentPath,
                        user_agent: navigator.userAgent
                    });
                }
            } else if (currentPath === '/vivienda') {
                pageType = 'housing';
            } else if (currentPath === '/acerca-de') {
                pageType = 'about';
            } else {
                pageType = 'landing';
            }
            
            if (window.trackPageView) {
                window.trackPageView(pageType, {
                    page_type: pageType,
                    page_path: currentPath,
                    user_agent: navigator.userAgent
                });
            }
            
            if (window.isDebugLoggingEnabled && window.isDebugLoggingEnabled()) {
                console.log('Page view tracked for:', pageType);
            }
        }

        // Initialize SEO and analytics when the app loads
        document.addEventListener('DOMContentLoaded', () => {
            // Initial SEO update
            handleRouteChange();
            
            // Check if analytics is enabled and initialized
            if (!window.isAnalyticsEnabled || !window.isAnalyticsEnabled() || !window.isAnalyticsInitialized()) {
                console.log('Analytics is disabled or not initialized');
                return;
            }
        });

        // Listen for popstate events (browser back/forward)
        window.addEventListener('popstate', handleRouteChange);

        // Create a function to be called by the router when routes change
        window.updatePageSEO = function(path) {
            updateSEOTags(path);
        };
    </script>
