version: "3.4"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: geodjango
    environment:
      PYTHONDONTWRITEBYTECODE: "no-write"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: wikiando_db
      DB_USER: wikirootcito
      DB_PASSWORD: passwordcita03921!
      # AWS Credentials
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: "wikiando"
      AWS_S3_REGION_NAME: "us-east-2"
    ports:
      - 8110:8000
    volumes:
      - .:/usr/src/app
      # Optional: Mount AWS credentials file (alternative to environment variables)
      # - ~/.aws:/root/.aws:ro
    depends_on:
      - db
    command: python geodjango/manage.py runserver 0.0.0.0:8000
    restart: on-failure

  db:
    image: postgis/postgis:14-3.1-alpine
    environment:
      POSTGRES_DB: wikiando_db
      POSTGRES_USER: wikirootcito
      POSTGRES_PASSWORD: passwordcita03921!
    expose:
      - 5432